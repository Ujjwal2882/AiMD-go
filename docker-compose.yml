version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: aimd_db
    environment:
      POSTGRES_USER: aimd_user
      POSTGRES_PASSWORD: aimd_password
      POSTGRES_DB: aimd_geo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aimd_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
