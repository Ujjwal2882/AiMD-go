# ═══════════════════════════════════════════════════════════════════
# AiMD-go Render Blueprint — Free Tier (single web service)
# Workers run in-process via FastAPI BackgroundTasks (no Celery needed)
# ═══════════════════════════════════════════════════════════════════

services:
  - type: web
    name: aimd-api
    runtime: docker
    plan: free
    repo: https://github.com/Ujjwal2882/AiMD-go
    branch: main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://aimd-go.netlify.app,http://localhost:3000
      - key: USE_BACKGROUND_TASKS
        value: "true"
